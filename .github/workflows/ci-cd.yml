name: CI/CD — Build, Security Gate & Docker Hub Publish

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & Verify (${{ matrix.repo }}:${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: php
            tag: 8.4-fpm-alpine
            context: php/8.4-fpm-alpine
          - repo: php
            tag: 8.4-apache-bookworm
            context: php/8.4-apache-bookworm
          - repo: php
            tag: 8.3-fpm-alpine
            context: php/8.3-fpm-alpine
          - repo: php
            tag: 8.2-fpm-alpine
            context: php/8.2-fpm-alpine
          - repo: postgres
            tag: 17-alpine
            context: postgres/17-alpine
          - repo: postgres
            tag: 16-alpine
            context: postgres/16-alpine
          - repo: mysql
            tag: 8.4-lts
            context: mysql/8.4-lts
          - repo: mysql
            tag: "8.0"
            context: mysql/8.0
          - repo: phpmyadmin
            tag: "5.2"
            context: phpmyadmin/5.2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Static Dockerfile Security Policy Verification
        run: |
          test -f "${{ matrix.context }}/Dockerfile"
          grep -q "^USER " "${{ matrix.context }}/Dockerfile"
          grep -q "^HEALTHCHECK " "${{ matrix.context }}/Dockerfile"
          grep -q "^LABEL " "${{ matrix.context }}/Dockerfile"

      - name: Build Container Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: |
            eriktonon/${{ matrix.repo }}:${{ matrix.tag }}
            eriktonon/${{ matrix.repo }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate & Push to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != ''
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME:-eriktonon}" --password-stdin
          docker push "eriktonon/${{ matrix.repo }}:${{ matrix.tag }}"
          docker push "eriktonon/${{ matrix.repo }}:${{ matrix.tag }}-${{ github.sha }}"
