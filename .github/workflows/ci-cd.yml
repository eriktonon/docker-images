name: CI/CD — Build, Security Scan & Docker Hub Publish

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & Scan (${{ matrix.repo }}:${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Modern Enterprise LTS Fleet
          - repo: php
            tag: 8.4-fpm-alpine
            context: php/8.4-fpm-alpine
          - repo: php
            tag: 8.4-apache-bookworm
            context: php/8.4-apache-bookworm
          - repo: php
            tag: 8.3-fpm-alpine
            context: php/8.3-fpm-alpine
          - repo: php
            tag: 8.2-fpm-alpine
            context: php/8.2-fpm-alpine
          - repo: postgres
            tag: 17-alpine
            context: postgres/17-alpine
          - repo: postgres
            tag: 16-alpine
            context: postgres/16-alpine
          - repo: mysql
            tag: 8.4-lts
            context: mysql/8.4-lts
          - repo: mysql
            tag: "8.0"
            context: mysql/8.0
          - repo: phpmyadmin
            tag: "5.2"
            context: phpmyadmin/5.2
          # Legacy Enterprise Fleet (Hardened)
          - repo: php
            tag: 8.0.0
            context: php/8.0.0-apache-buster
          - repo: php
            tag: 7.4.7
            context: php/7.4.7-apache-buster
          - repo: postgres
            tag: "12.0"
            context: postgres/12.0
          - repo: postgres
            tag: "11.5"
            context: postgres/11.5
          - repo: postgres
            tag: 9.6.15
            context: postgres/9.6.15
          - repo: mysql
            tag: 8.0.18
            context: mysql/8.0.18
          - repo: mysql
            tag: 5.7.27
            context: mysql/5.7.27

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Trivy Dockerfile Misconfiguration Scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.28.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.context }}
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Authenticate to Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'eriktonon' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.9.0
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            eriktonon/${{ matrix.repo }}:${{ matrix.tag }}
            eriktonon/${{ matrix.repo }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
